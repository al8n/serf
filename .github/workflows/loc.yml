name: loc

on:
  push:
    branches:
      - main
      - refactor/sansio
    paths-ignore:
      - "README.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.md"
      - "**.txt"
      - "art"
  pull_request:
    paths-ignore:
      - "README.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.md"
      - "**.txt"
      - "art"
  workflow_dispatch:

jobs:
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Install tokeit
        run: |
          cargo install tokeit --force

      - name: Count lines of code (workspace total + each crate)
        run: |
          set -euo pipefail
          tokeit
          mv tokeit.json loc-serf.json
          for c in serf-proto serf-driver serf-compio serf-reactor; do
            ( cd "$c" && tokeit )
            mv "$c/tokeit.json" "loc-$c.json"
          done

      - name: Upload all loc to the gist in one request
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GIST_PAT }}
          script: |
            const fs = require('fs');
            const gistId = 'd29ceff54c025fe4e8b144a51efb9324';
            // Gist file `serf` is the workspace total (the main README's LoC
            // badge reads …/raw/serf); the rest are per-crate, ready for
            // per-crate READMEs. The gists API accepts every file in one PATCH,
            // so one request avoids the per-crate rate-limit storm.
            const crates = [
              'serf-proto',
              'serf-driver',
              'serf-compio',
              'serf-reactor',
            ];
            const files = {
              serf: { content: fs.readFileSync('loc-serf.json', 'utf8') },
            };
            for (const c of crates) {
              files[c] = { content: fs.readFileSync(`loc-${c}.json`, 'utf8') };
            }
            await github.rest.gists.update({ gist_id: gistId, files });
            console.log('Gist updated');
