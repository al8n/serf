name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.md"
      - "**.txt"
      - "art"
  pull_request:
    paths-ignore:
      - "README.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.md"
      - "**.txt"
      - "art"
  workflow_dispatch:
  schedule:
    - cron: "0 1 */30 * *"

jobs:
  test:
    name: ${{ matrix.os }} - ${{ matrix.runtime }} - ${{ matrix.stream_layer }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest,
          # - windows-latest
        runtime: [tokio, smol]
        stream_layer:
          # - tls
          # - native-tls
          - tcp
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup update stable && rustup default stable
          rustup component add clippy
          rustup component add rustfmt

      - name: Setup loopback interface (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: ci\setup_subnet_windows.ps1
      - name: Setup loopback interface (MacOS)
        if: matrix.os == 'macos-latest'
        run: ci/setup_subnet_macos.sh
      - name: Setup loopback interface (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: ci/setup_subnet_ubuntu.sh

      - name: Run Unit Tests for core
        run: |
          cargo test --no-default-features --features "test,encryption,serde,quickcheck"
        working-directory: serf-core

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.runtime }}-${{ matrix.stream_layer }}

  serf-proto:
    name: serf-proto - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "default", flags: "" }
          - { name: "coords-aes-gcm", flags: "--features coordinates,aes-gcm" }
          - { name: "coords-chacha", flags: "--features coordinates,chacha20-poly1305" }
          - { name: "all-features", flags: "--all-features" }
          - { name: "no-default", flags: "--no-default-features" }
          - { name: "coords-aes-gcm-tcp", flags: "--features coordinates,aes-gcm,tcp" }
          - { name: "quic-rustls-ring", flags: "--no-default-features --features quic-rustls-ring" }
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup update stable && rustup default stable
          rustup component add clippy
          rustup component add rustfmt

      - name: Format check
        if: matrix.name == 'default'
        run: cargo fmt --check
        working-directory: serf-proto

      - name: Clippy
        run: cargo clippy -p serf-proto --all-targets ${{ matrix.flags }} -- -D warnings

      - name: Test
        run: cargo test -p serf-proto ${{ matrix.flags }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-serf-proto-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.name }}
