name: Fuzz Testing

# Fuzz the preserved legacy serf-core wire codec. The fuzz crate (serf-types-fuzz,
# target `messages`) lives in the excluded `legacy/` workspace and fuzzes serf's
# message (de)serialization; it is built + briefly run from that workspace root.

on:
  push:
    branches:
      - main
      - refactor/sansio
    paths-ignore:
      - "README.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.md"
      - "**.txt"
      - "art"
  pull_request:
    paths-ignore:
      - "README.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.md"
      - "**.txt"
      - "art"
  schedule:
    - cron: "0 1 */30 * *"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: legacy
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzzing
        run: |
          cargo fuzz build
          cargo fuzz run messages -- -max_len=4096 -max_total_time=300
