[workspace]
members = [
  "serf-proto",
  "serf-embedded",
  "serf-driver",
  "serf-compio",
  "serf-reactor",
]
exclude = ["legacy"]
resolver = "3"

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.85.0"
description = "A decentralized solution for service discovery and orchestration that is lightweight, highly available, and fault tolerant."
repository = "https://github.com/al8n/serf"
homepage = "https://github.com/al8n/serf"
license = "MPL-2.0"
keywords = ["gossip", "service-discovery", "cluster", "membership", "distributed"]
categories = ["network-programming", "asynchronous", "algorithms"]
readme = "README.md"

[workspace.dependencies]
bytes = "1"
byteorder = "1"
derive_more = { version = "2", features = ["full"] }
futures = { version = "0.3", default-features = false }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
humantime = "2"
humantime-serde = "1"
indexmap = "2"
thiserror = { version = "2", default-features = false }
viewit = "0.1.5"
regex = "1"
smol_str = "0.3"
smallvec = "1"
rand = "0.10"
tracing = "0.1"
clap = { version = "4", default-features = false, features = ["std", "derive", "env"] }

# Networking / transport
compio = { version = "0.19", default-features = false }
agnostic = "0.10"
agnostic-lite = { version = "0.6", features = ["time"] }
arc-swap = "1"
flume = { version = "0.12", default-features = false }
hostaddr = { version = "0.2", default-features = false }
lochan = "0.1"
hickory-proto = { version = "0.26", default-features = false }
resolv-conf = { version = "0.7", default-features = false }
getifs = "0.6"
iprfc = "0.2"

arbitrary = { version = "1", default-features = false, features = ["derive"] }
quickcheck = { version = "1", default-features = false }

memberlist-proto = { version = "0.3", default-features = false }
memberlist-core = { version = "0.8.5", default-features = false }
memberlist = { version = "0.8.5", default-features = false }

serf-core = { path = "serf-core", version = "0.5", default-features = false }
serf = { path = "serf", version = "0.5", default-features = false }
serf-proto = { path = "serf-proto", default-features = false }
serf-driver = { path = "serf-driver", default-features = false }
