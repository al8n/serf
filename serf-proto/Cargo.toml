[package]
name = "serf-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["tag-regex"]
# Encryption key management messages (KeyRequestMessage / KeyResponseMessage).
# Pulls in the memberlist-proto encryption backend (at least one AEAD cipher
# must be selected; both are forwarded here so the caller can pick).
# Activating this feature makes the key message types available and ensures
# key material is held in memberlist_proto::SecretKey (typed, cipher-tagged)
# rather than raw bytes.
aes-gcm = ["memberlist-proto/aes-gcm", "dep:zeroize"]
chacha20-poly1305 = ["memberlist-proto/chacha20-poly1305", "dep:zeroize"]
# Umbrella that activates both backends (convenient for tests / CI).
encryption = ["aes-gcm", "chacha20-poly1305"]
# Vivaldi network coordinate estimation.  Enabled by default under std.
# Disable for embedded / no_std targets or when the coordinate overhead is
# not desired.
coordinates = []
# Regex-backed tag-filter matching (mirrors Go serf `regexp.MatchString`).
# When enabled (default), a `Filter::Tag` expression is compiled as a regex
# and matched with partial (anywhere-in-value) semantics.  When disabled
# (`--no-default-features`), tag matching falls back to exact string equality.
# This crate currently requires std regardless of this flag; disabling
# `tag-regex` is the forward-compatible preparation for a future no_std port,
# not current no_std support.
tag-regex = ["dep:regex"]
# Plain-TCP reliable coordinator — enables `memberlist_proto::streams::StreamEndpoint`
# (record-layer-shaped, label-prefixed stream transport).  Activating this feature
# makes `Reliable` implementable for `memberlist_proto::TcpEndpoint` and friends.
tcp = ["memberlist-proto/tcp"]
# TLS-over-TCP reliable coordinator — enables the TLS record layer on top of the
# plain-TCP stream transport.  Implies `tcp`.
tls = ["tcp", "memberlist-proto/tls"]
# QUIC coordinator — enables `memberlist_proto::QuicEndpoint` (unreliable datagram +
# reliable stream over a single QUIC connection per peer).  Requires a TLS backend;
# at least one of `quic-rustls-ring` / `quic-rustls-aws-lc-rs` must be selected.
quic = ["memberlist-proto/quic"]
quic-rustls-ring = ["quic", "memberlist-proto/quic-rustls-ring"]

[dependencies]
memberlist-proto = { git = "https://github.com/al8n/memberlist", branch = "main", default-features = false, features = ["std"] }
bytes = { workspace = true }
derive_more = { workspace = true }
rand = { workspace = true }
thiserror.workspace = true
bitflags = "2"
buffa = { version = "0.8", default-features = false }
smol_str = { workspace = true }
zeroize = { version = "1", optional = true }
regex = { version = "1", optional = true }

[build-dependencies]
buffa-build = "0.8"

[dev-dependencies]
# The QUIC super-machine loopback test builds a quinn-proto config bundle with a
# self-signed cert and an accept-any verifier (the same shape memberlist-proto's
# own QUIC coordinator tests use). Only the `quic`-gated test module references
# these; they are unconditional dev-deps so the test crate always resolves.
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rcgen = "0.14"
ring = "0.17"
