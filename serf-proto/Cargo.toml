[package]
name = "serf-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std", "tag-regex"]

# `std` and `alloc` are independent capability tiers (std does NOT pull alloc).
# `alloc` is the minimal heap tier for no_std targets; the core machine + `tcp`
# are no_std+alloc, while `coordinates` (Vivaldi float math), `tag-regex`
# (regex), `tls` (rustls) and `quic` (quinn-proto) require `std`.
std = [
  "memberlist-proto/std",
  "bytes/default",
  "smol_str/default",
  "thiserror/default",
  "rustc-hash/default",
  "rand/default",
  "buffa/default",
  "derive_more/std",
  "zeroize?/std",
]
alloc = ["memberlist-proto/alloc", "rand/alloc"]

# Encryption key management messages (KeyRequestMessage / KeyResponseMessage).
# Pulls in the memberlist-proto encryption backend (at least one AEAD cipher
# must be selected; both are forwarded here so the caller can pick).
# Activating this feature makes the key message types available and ensures
# key material is held in memberlist_proto::SecretKey (typed, cipher-tagged)
# rather than raw bytes. no_std+alloc (memberlist's ciphers are no_std+alloc).
aes-gcm = ["alloc", "memberlist-proto/aes-gcm", "dep:zeroize"]
chacha20-poly1305 = ["alloc", "memberlist-proto/chacha20-poly1305", "dep:zeroize"]
# Umbrella that activates both backends (convenient for tests / CI).
encryption = ["aes-gcm", "chacha20-poly1305"]
# Vivaldi network coordinate estimation. Uses f64 transcendental math (ln/sqrt)
# with no libm-based no_std fallback yet, so it requires std. A libm-backed
# no_std coordinates is a future follow-up.
coordinates = ["std"]
# Regex-backed tag-filter matching (mirrors Go serf `regexp.MatchString`).
# When enabled (default), a `Filter::Tag` expression is compiled as a regex
# and matched with partial (anywhere-in-value) semantics.  When disabled
# (`--no-default-features`), tag matching falls back to exact string equality.
# regex is std-only, so this feature pulls `std`; the no_std path is the
# exact-equality fallback.
tag-regex = ["std", "dep:regex"]
# Plain-TCP reliable coordinator — enables `memberlist_proto::streams::StreamEndpoint`
# (record-layer-shaped, label-prefixed stream transport).  Activating this feature
# makes `Reliable` implementable for `memberlist_proto::TcpEndpoint` and friends.
# The plain-TCP `RawRecords` path is no_std+alloc (the stream codec buffers into
# `Vec`).
tcp = ["alloc", "dep:libm", "memberlist-proto/tcp"]
# TLS-over-TCP reliable coordinator — enables the TLS record layer on top of the
# plain-TCP stream transport.  Implies `tcp`. rustls is std-only.
tls = ["std", "tcp", "memberlist-proto/tls"]
# QUIC coordinator — enables `memberlist_proto::QuicEndpoint` (unreliable datagram +
# reliable stream over a single QUIC connection per peer).  Requires a TLS backend;
# at least one of `quic-rustls-ring` / `quic-rustls-aws-lc-rs` must be selected.
# quinn-proto is std-only.
quic = ["std", "dep:libm", "memberlist-proto/quic"]
quic-rustls-ring = ["quic", "memberlist-proto/quic-rustls-ring"]

[dependencies]
memberlist-proto = { git = "https://github.com/al8n/memberlist", branch = "main", default-features = false }
# no_std+alloc-capable deps: pinned `default-features = false` so a no_std build
# does not silently pull each dep's `std`; the `std` feature layers it back.
bytes = { version = "1", default-features = false }
derive_more = { version = "2", default-features = false, features = [
  "display",
  "is_variant",
] }
rand = { version = "0.10", default-features = false }
thiserror.workspace = true
bitflags = { version = "2", default-features = false }
buffa = { version = "0.8", default-features = false }
smol_str = { version = "0.3", default-features = false }
# hashbrown + rustc-hash back the `FxHashMap`/`FxHashSet` aliases (std's
# `HashMap`/`HashSet` are not in `alloc`).
hashbrown = { version = "0.17", default-features = false }
rustc-hash = { version = "2", default-features = false }
# f64 `log10`/`ceil` for the query-timeout fanout factor on no_std (core has no
# float transcendentals); pulled only by `tcp`/`quic` (the endpoint's gate).
libm = { version = "0.2", optional = true, default-features = false }
# Zeroizes the transient plaintext key buffer; only pulled by the AEAD features
# (which are the `alloc` tier), so `alloc` covers it.
zeroize = { version = "1", optional = true, default-features = false, features = [
  "alloc",
] }
# regex is std-only; gated behind `tag-regex` (which pulls `std`).
regex = { version = "1", optional = true }

[build-dependencies]
buffa-build = "0.8"

[dev-dependencies]
# The QUIC super-machine loopback test builds a quinn-proto config bundle with a
# self-signed cert and an accept-any verifier (the same shape memberlist-proto's
# own QUIC coordinator tests use). Only the `quic`-gated test module references
# these; they are unconditional dev-deps so the test crate always resolves.
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rcgen = "0.14"
ring = "0.17"
