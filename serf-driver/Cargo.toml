[package]
name = "serf-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Runtime-agnostic glue shared by the serf async driver crates"

[features]
default = ["tag-regex"]
tcp = ["serf-proto/tcp"]
tls = ["tcp", "serf-proto/tls"]
quic = ["serf-proto/quic"]
quic-rustls-ring = ["quic", "serf-proto/quic-rustls-ring"]
coordinates = ["serf-proto/coordinates"]
tracing = ["dep:tracing"]
tag-regex = ["serf-proto/tag-regex"]
# Encryption backends — forward to serf-proto (the key-management projection
# types) and memberlist-proto (the live `Keyring` the shared apply logic
# read-modify-writes). Aggregated to the `encryption` cfg by `build.rs`.
aes-gcm = ["serf-proto/aes-gcm", "memberlist-proto/aes-gcm", "dep:rand", "dep:zeroize"]
chacha20-poly1305 = [
  "serf-proto/chacha20-poly1305",
  "memberlist-proto/chacha20-poly1305",
  "dep:rand",
  "dep:zeroize",
]

[dependencies]
serf-proto = { path = "../serf-proto", default-features = false }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
rand = { workspace = true, optional = true, features = ["sys_rng"] }
zeroize = { version = "1", optional = true, default-features = false }
# Pinned to the same git+branch as serf-proto to guarantee a single copy in the
# resolver; the shared key-management apply logic rotates memberlist's live
# `Keyring` and matches on `SecretKey` under the encryption cfg gate.
memberlist-proto = { git = "https://github.com/al8n/memberlist", branch = "main", default-features = false, features = ["std"] }

[dev-dependencies]
smol_str = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
